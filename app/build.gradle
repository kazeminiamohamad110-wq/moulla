plugins { id 'com.android.application' }

// The owner signing key MUST live outside this public repository.
def keyFilePath = System.getenv('PMM_KEYSTORE_PATH')
def storePass = System.getenv('PMM_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('PMM_KEYSTORE_ALIAS') ?: 'payemenbaremola-release'
def keyPass = System.getenv('PMM_KEY_PASSWORD') ?: storePass

android {
    namespace 'ir.nahj.towhidkarbordi'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.nahj.towhidkarbordi'
        minSdk 23
        targetSdk 34
        versionCode 152
        versionName '1.0.2'
    }
    signingConfigs {
        release {
            if (keyFilePath && storePass) {
                storeFile file(keyFilePath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            // Debug should never replace the owner production installation.
            applicationIdSuffix '.ownerrebuilddebug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Opt-in owner lossless asset trial. The default build still uses the exact original R5 assets.
if (project.findProperty('pmmLosslessAssets') == 'true') {
    def staged = file("$buildDir/pmm-lossless-assets")
    def checks = new groovy.json.JsonSlurper().parse(rootProject.file('optimization/lossless-assets.json'))
    def digest = { File f -> java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString() }
    def actual = fileTree(staged).files.collectEntries { f -> [(staged.toPath().relativize(f.toPath()).toString().replace('\\','/')): digest(f)] }
    def originals = file('src/main/assets')
    def originalActual = fileTree(originals).files.collectEntries { f -> [(originals.toPath().relativize(f.toPath()).toString().replace('\\','/')): digest(f)] }
    if (actual != checks.staged_assets || originalActual != checks.source_assets) {
        throw new GradleException('Lossless assets missing or stale. Run python optimization/prepare_lossless_assets.py first.')
    }
    android.sourceSets.main.assets.setSrcDirs([staged])
}
