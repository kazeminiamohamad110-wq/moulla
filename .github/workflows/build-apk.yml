name: Build current Moulla v152 main DEBUG (NOT a market release)
on:
  workflow_dispatch:
    inputs:
      approve_debug_build:
        description: 'Build v152 DEBUG from current main (does not sign a market release)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  current-main-debug:
    if: ${{ inputs.approve_debug_build == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify v152 is the only active source, preserving exact frozen assets
        run: |
          set -euo pipefail
          python3 scripts/verify_owner_v152_candidate.py
          python3 optimization/prepare_lossless_assets.py
          python3 - <<'PY'
          import json
          p=json.load(open("design/owner-active-version.json",encoding="utf-8"))
          assert p["active_version"]=="v152" and p["active_branch"]=="main"
          assert not p["cleanup_authorized"]
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Compile independent v152 DEBUG without owner release key
        run: |
          set -euo pipefail
          env -u PMM_KEYSTORE_PATH -u PMM_KEYSTORE_PASSWORD -u PMM_KEY_PASSWORD gradle --no-daemon :app:assembleDebug -PpmmLosslessAssets=true
      - name: Verify APK identity, signature, alignment, and SHA-256
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --verbose "$apk"
          "$bt/zipalign" -c -v 4 "$apk"
          mkdir -p dist
          "$bt/aapt" dump badging "$apk" > dist/package.txt
          grep -F "name='ir.nahj.towhidkarbordi.ownerrebuilddebug'" dist/package.txt
          grep -F "versionCode='152'" dist/package.txt
          cp "$apk" dist/Moulla-v152-DEBUG.apk
          (cd dist && sha256sum Moulla-v152-DEBUG.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Moulla-v152-current-main-DEBUG-${{ github.run_id }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
