name: Archive owner all seven sections and transcript revisions
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/owner-content-archive-sync.yml]
permissions:
  contents: write
concurrency:
  group: moulla-owner-content-archive-main
  cancel-in-progress: false
jobs:
  mirror-owner-content:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify active v152 source and all original assets
        run: |
          python3 scripts/verify_owner_v152_candidate.py
      - name: Archive all sections in separate immutable scope
        run: python3 scripts/archive_owner_all_sections_v152.py --fetch --output owner-content/all-v152
      - name: Commit only append-only content records and mutable latest pointer
        shell: bash
        run: |
          set -euo pipefail
          git add -- owner-content/all-v152/
          if git diff --cached --quiet; then
            echo 'No new owner content revision.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git diff --cached --name-status -- owner-content/ | grep -E '^[DMR]' | grep -v $'M\towner-content/all-v152/latest.json'; then
            echo 'BLOCKED: immutable content modification or deletion' >&2
            exit 1
          fi
          git config user.name 'moulla-owner-content-archive[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content(owner): archive all published sections and text revisions [skip ci]'
          git push origin HEAD:main
